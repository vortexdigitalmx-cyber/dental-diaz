<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Dental Díaz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/agenda.css">
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body class="panel pa-body" data-panel="a">
<div class="pa">
  <aside class="lateral" aria-label="Menú del panel">
    <a class="logo" href="index.html"><img src="assets/img/simbolo-marino.svg" alt=""><span>Dental Díaz</span></a>
    <nav><a class="lateral__item" href="#resumen" data-ir="resumen"><svg class="i" aria-hidden="true"><use href="#i-layout-dashboard"/></svg><span>Resumen</span></a><a class="lateral__item" href="#agenda" data-ir="agenda"><svg class="i" aria-hidden="true"><use href="#i-calendar-week"/></svg><span>Agenda</span></a><a class="lateral__item" href="#pacientes" data-ir="pacientes"><svg class="i" aria-hidden="true"><use href="#i-users-group"/></svg><span>Pacientes</span></a><a class="lateral__item" href="#ligas" data-ir="ligas"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg><span>Ligas</span></a><a class="lateral__item" href="#comision" data-ir="comision"><svg class="i" aria-hidden="true"><use href="#i-receipt-2"/></svg><span>Comisión</span></a><a class="lateral__item" href="#pendientes" data-ir="pendientes"><svg class="i" aria-hidden="true"><use href="#i-checklist"/></svg><span>Pendientes</span><span class=cuenta>5</span></a><a class="lateral__item" href="#contenido" data-ir="contenido"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg><span>Contenido</span></a></nav>
    <div class="lateral__pie"><span class="avatar">MD</span><div><strong>Dra. Díaz</strong><small>Administradora</small></div></div>
  </aside>
  <div class="lateral-velo" data-menu-lateral></div>
  <main class="pa__main">
    <header class="pa__top">
      <button class="icono-btn btn-menu" data-menu-lateral aria-label="Abrir menú"><svg class="i" aria-hidden="true"><use href="#i-menu-2"/></svg></button>
      <div><h1 data-vista-titulo>Resumen</h1><span class="mini" data-fecha-hoy></span></div>
      <div class="pa__top-der"><span class="demo-chip">Propuesta A<span class="solo-escritorio"> · datos de ejemplo</span></span><span class="avatar">MD</span></div>
    </header>
    <div data-vista-cuerpo></div>
  </main>
</div>
<div class="velo" id="velo"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Ficha del paciente">
  <div class="drawer__top"><span class="mini">Ficha del paciente</span><button class="icono-btn" data-cerrar-drawer aria-label="Cerrar"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="drawer__cuerpo" data-drawer-cuerpo></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/nubo-states.js"></script>
<script src="assets/js/nubo.js"></script>
<script src="assets/js/panel.js"></script>
</body>
</html>
